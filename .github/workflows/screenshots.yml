name: Capture dashboard screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-screenshots
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Capture live UI and test interactions
        run: node scripts/capture.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: docs/screenshots/
          if-no-files-found: warn
      - name: Attach screenshots to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture authentic live dashboard screenshots"
            git pull --rebase origin main
            git push
          fi
