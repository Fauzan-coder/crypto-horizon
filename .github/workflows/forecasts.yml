name: Refresh AutoTS forecasts
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      generations:
        description: AutoTS search generations (0-20)
        default: '3'
        type: string
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - name: Fit, evaluate, and forecast
        env:
          GENERATIONS: ${{ inputs.generations || '3' }}
        run: python -m pipeline.forecast --generations "$GENERATIONS"
      - name: Publish forecast snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh evaluated 10-day forecasts"
            git push
          fi
